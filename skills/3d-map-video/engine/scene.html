<body><script>if(location.search.includes("nohud=1"))document.write("<style>#hud{display:none!important}</style>")</script><canvas id="stars"></canvas><div id="map"></div><div id="grade"></div><canvas id="fx"></canvas><div id="vig"></div><div id="overlay"></div><div id="dim"></div><div id="hud"></div>
<script>
// 数据驱动地图镜头引擎（由乾陵样片 mapscene/scene.html 抽象而来）。读取 ?scene=<path> 的 scene.json（engine/compile.py 生成）。
const E=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a))), lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, easeOut=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let S,map;
// ---------- HUD：片名/字幕/面板/来源注记（复刻原 Hypit look，品牌红 #C8102E，Noto Sans SC）----------
const HUD=[];
function box(f,W,H,cls){const e=document.createElement('div');e.className='fr '+cls;e.style.left=f[0]/100*W+'px';e.style.top=f[1]/100*H+'px';e.style.width=(f[2]-f[0])/100*W+'px';e.style.height=(f[3]-f[1])/100*H+'px';document.getElementById('hud').appendChild(e);return e;}
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function buildHud(W,H){const L=S.layout, z=L.sizes; document.getElementById('hud').style.width=W+'px';document.getElementById('hud').style.height=H+'px'; let all='';
  if(S.title){const e=box(L.title,W,H,'');e.style.flexDirection='column';e.innerHTML=`<div class="tt" style="font-size:${z.title}px">${esc(S.title.text)}</div>`+(S.title.sub?`<div class="ts" style="font-size:${z.titlesub}px">${esc(S.title.sub)}</div>`:'');HUD.push({el:e,t0:S.title.t[0],t1:S.title.t[1],kind:'title'});all+=S.title.text+(S.title.sub||'');}
  for(const c of S.captions||[]){const e=box(L.sub,W,H,'cap');let html='',i=0,t=c.text;const hl=(c.hl||[]).filter(Boolean).sort((a,b)=>b.length-a.length);
    while(i<t.length){const m=hl.find(h=>t.startsWith(h,i));if(m){html+=`<span class="hl">${esc(m)}</span>`;i+=m.length;continue;}let j=i;while(j<t.length&&!hl.some(h=>t.startsWith(h,j)))j++;html+=`<span>${esc(t.slice(i,j))}</span>`;i=j;}
    e.innerHTML=`<div class="ct" style="font-size:${z.sub}px;padding:0 12px;text-wrap:balance">${html}</div>`;HUD.push({el:e,t0:c.t[0],t1:c.t[1],kind:'cap'});all+=t;}
  if(S.panel){const p=S.panel,e=box(L.panel,W,H,'pnl');e.style.fontSize=z.panel+'px';e.style.height='auto';e.innerHTML=`<div class="ph" style="font-size:${z.panelhead}px">${esc(p.head)}</div>`+p.rows.map(r=>`<div><span class="pk">${esc(r[0])}　</span>${esc(r[1])}</div>`).join('');HUD.push({el:e,t0:p.t[0],t1:p.t[1],kind:'panel'});all+=p.head+p.rows.flat().join('');}
  for(const c of S.counter||[]){const e=box(L.counter,W,H,'ctr');e.innerHTML=`<div class="d" style="font-size:96px">${esc(c.big)}</div>`+(c.small?`<div class="s" style="font-size:40px">${esc(c.small)}</div>`:'');HUD.push({el:e,t0:c.t0,t1:c.t1,kind:'ctr'});all+=c.big+(c.small||'');}
  for(const c of S.cards||[]){const e=box(L.card,W,H,'card');e.style.height='auto';e.innerHTML=`<div class="b" style="font-size:${c.size||92}px">${esc(c.big)}</div>`+(c.label?`<div class="l" style="font-size:40px">${esc(c.label)}</div>`:'');HUD.push({el:e,t0:c.t0,t1:c.t1,kind:'card'});all+=c.big+(c.label||'');}
  if(S.chips){const e=box(L.chips,W,H,'chips');e.innerHTML=S.chips.items.map(c=>`<div class="chip" style="border-color:${c.color};font-size:30px"><span class="sq" style="background:${c.color}"></span><span class="tx">${esc(c.text)}</span><span class="st"></span></div>`).join('');HUD.push({el:e,t0:S.chips.show?Math.min(...S.chips.show.map(w=>w[0])):S.chips.t0,t1:S.chips.show?Math.max(...S.chips.show.map(w=>w[1])):S.chips.t1,kind:'chips'});all+=S.chips.items.map(c=>c.text+(c.state||'')).join('');}
  if(S.style==='sanwei'){const y=S.chapters?7.9:3.6;let e=box([4,y,60,y+2.2],W,H,'wm');e.style.fontSize='34px';e.innerHTML='<i></i>'+(S.brand||'我的频道');HUD.push({el:e,t0:0,t1:1e9,kind:'credit'});e=box([60,62.6,96,64.4],W,H,'wm2');e.style.fontSize='24px';e.textContent='地图示意';HUD.push({el:e,t0:0,t1:1e9,kind:'credit'});all+=(S.brand||'我的频道')+'地图示意';}
  if(S.credit){const e=box(L.credit,W,H,'crd');e.style.fontSize=z.credit+'px';e.textContent=S.credit;HUD.push({el:e,t0:0,t1:1e9,kind:'credit'});all+=S.credit;}
  S.__alltext=all;}
function fitCaps(){for(const h of HUD){if(h.kind!=='cap')continue;const d=h.el.querySelector('.ct');const fs0=parseFloat(d.style.fontSize);h.el.style.display='flex';d.style.whiteSpace='nowrap';const r=h.el.clientWidth/d.scrollWidth;if(r<1&&r>=0.88){d.style.fontSize=Math.floor(fs0*r)+'px';}else if(r<0.88){d.style.whiteSpace='normal';}h.el.style.display='none';}}
function winVis(t,ws,F){let v=0;for(const w of ws){v=Math.max(v,Math.min(1,(t-w[0])*F/10,(w[1]-t)*F/10));}return Math.max(0,v);}
function hud(t){const F=S.fps;let dimv=0;for(const h of HUD){const a=t-h.t0,b=h.t1-t;let op=0,tr='';
  if(a>=0&&b>0){ if(h.kind==='cap'){const u=Math.min(1,a*F/6);op=u;tr=`translateY(${10*(1-easeOut(u))}px)`;}
    else if(h.kind==='title'){const u=Math.min(1,a*F/12),o=Math.min(1,b*F/14);op=Math.min(u,o);tr=`scale(${o<1?1.04-0.02*o:0.92+0.08*easeOut(u)+0.02*Math.min(1,a/(h.t1-h.t0))})`;}
    else if(h.kind==='panel'){const u=Math.min(1,a*F/14),o=Math.min(1,b*F/15);op=Math.min(u,o);tr=`translateX(${-48*(1-Math.min(easeOut(u),easeOut(o)))}px)`;}
    else if(h.kind==='ctr'||h.kind==='card'){const u=Math.min(1,a*F/9),o=Math.min(1,b*F/9);op=Math.min(u,o);tr=`scale(${0.7+0.3*back(Math.min(1,a*F/12))})`;}
    else if(h.kind==='chips'){const u=Math.min(1,a*F/10),o=Math.min(1,b*F/10);op=S.chips.show?winVis(t,S.chips.show,F):Math.min(u,o);const ch=h.el.children;S.chips.items.forEach((c,i)=>{const off=c.off!=null&&t>=c.off;ch[i].classList.toggle('off',off&&!c.keep);ch[i].querySelector('.st').textContent=off?(c.state||''):'';const pulse=c.off!=null?Math.max(0,1-Math.abs(t-c.off)*3):0;ch[i].style.transform=`scale(${1+0.18*pulse})`;});}
    else op=1;}
  if(h.kind==='card')dimv=Math.max(dimv,op);
  h.el.style.opacity=op;h.el.style.transform=tr;h.el.style.display=op>0.001?'flex':'none';}
  document.getElementById('dim').style.opacity=(dimv*(S.dim??0.35)).toFixed(3);}
function satPending(){ // 低分辨率瓦片检测：视野内、接近当前缩放级别、尚未加载完成的影像/地形瓦片数
  let n=0;const z=Math.floor(map.getZoom());const mgrs=[map.style.tileManagers&&map.style.tileManagers.sat, map.terrain&&map.terrain.tileManager, map.style.tileManagers&&map.style.tileManagers.demhs];
  for(const m of mgrs){ if(!m||!m._inViewTiles) continue; for(const tl of m._inViewTiles.getAllTiles()){ if(tl.state!=='loaded'&&tl.state!=='errored'&&tl.tileID.overscaledZ>=Math.min(z-1,(m!==mgrs[0]?(S.dem_maxzoom||12):99)-0)) n++; } }
  return n;}

function cam(t){const K=S.keys;let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1];let u=E(t,a[0],b[0]);if(a[6]==='io')u=ease(u);
  return {center:[lerp(a[1],b[1],u),lerp(a[2],b[2],u)],zoom:lerp(a[3],b[3],u),pitch:Math.min(85,lerp(a[4],b[4],u)),bearing:lerp(a[5],b[5],u)};}
function grad(id,p,col){map.setPaintProperty(id,'line-gradient',p<=0?['step',['line-progress'],'rgba(0,0,0,0)',0,'rgba(0,0,0,0)']:(p>=1?['step',['line-progress'],col,1,col]:['step',['line-progress'],col,p,'rgba(0,0,0,0)']));}
function slice(l,p){const L=l.cum[l.cum.length-1]*Math.min(1,p);const out=[l.coords[0]];for(let i=1;i<l.coords.length;i++){if(l.cum[i]<=L){out.push(l.coords[i]);continue;}const a=l.coords[i-1],b=l.coords[i],u=(L-l.cum[i-1])/((l.cum[i]-l.cum[i-1])||1);out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]);break;}if(out.length<2)out.push(out[0]);return out;}
function rgba(c,a){if(c.startsWith('rgba')){return c.replace(/,\s*([\d.]+)\)$/,(m,x)=>`,${(+x)*a})`);}const n=parseInt(c.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

function cam(t){const K=S.keys;let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1];let u=E(t,a[0],b[0]);if(a[6]==='io')u=ease(u);
  return {center:[lerp(a[1],b[1],u),lerp(a[2],b[2],u)],zoom:lerp(a[3],b[3],u),pitch:Math.min(85,lerp(a[4],b[4],u)),bearing:lerp(a[5],b[5],u)};}
function grad(id,p,col){map.setPaintProperty(id,'line-gradient',p<=0?['step',['line-progress'],'rgba(0,0,0,0)',0,'rgba(0,0,0,0)']:(p>=1?['step',['line-progress'],col,1,col]:['step',['line-progress'],col,p,'rgba(0,0,0,0)']));}
function rgba(c,a){if(c.startsWith('rgba')){return c.replace(/,\s*([\d.]+)\)$/,(m,x)=>`,${(+x)*a})`);}const n=parseInt(c.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
// ---------- v2 段落天气/调色层（模板固定预设；episode 只写 moods:[{t0,t1,preset,strength}]）----------
const MOOD_CAP=0.5;   // v3：段落调色强度上限
const MOOD={
  neutral:{sat:0.0,con:0.15,bmin:0,bmax:1,tintA:0,vig:0,snow:0},   // v3：反差 0.08→0.15、不再加饱和
  warm:{sat:0.0,con:0.18,bmin:0,bmax:1,tint:'#FFB066',tintA:0.10,vig:0.15,snow:0},   // v3：去掉褐色（tint 0.32→0.10、暗角 0.30→0.15）
  cold:{sat:-0.35,con:0.10,bmin:0.06,bmax:0.95,tint:'#8DB8FF',tintA:0.45,vig:0.35,snow:0},
  snow:{sat:-0.38,con:0.10,bmin:0.07,bmax:0.97,tint:'#A9C9FF',tintA:0.38,vig:0.42,snow:1.0},
  dark:{sat:-0.40,con:0.14,bmin:0.02,bmax:0.84,tint:'#1E3358',tintA:0.42,vig:0.50,snow:0.35},
  blood:{sat:-0.30,con:0.18,bmin:0,bmax:0.90,tint:'#C8102E',tintA:0.30,vig:0.50,snow:0.22},
  gray:{sat:-0.55,con:0.08,bmin:0.03,bmax:0.90,tint:'#5E6372',tintA:0.28,vig:0.40,snow:0}};
function moodAt(t){const N=MOOD.neutral,o={...N},X=0.45;let wsum=0;const acc={sat:0,con:0,bmin:0,bmax:0,vig:0,snow:0};
  for(const m of (S.moods||[])){const P=MOOD[m.preset]||N,st=Math.min(MOOD_CAP,m.strength??1);const w=E(t,m.t0-X,m.t0+X)*(1-E(t,m.t1-X,m.t1+X));if(m.el)m.el.style.opacity=(w*st*(P.tintA||0)).toFixed(3);
    if(w<=0)continue;const k=w*st;wsum+=k;for(const q in acc)acc[q]+=k*((P[q]??N[q])-N[q]);}
  for(const q in acc)o[q]=N[q]+acc[q];return o;}
const SWB={sat:-0.30,con:0.12,bmax:0.70};   // v4 sanwei 底图基调（叠加在 mood 之上）
function applyMood(t){if(!S.moods||!S.moods.length)return;const o=moodAt(t),W=S.w,H=S.h;if(window.SW){o.sat+=SWB.sat;o.con+=SWB.con;o.bmax=Math.min(o.bmax,SWB.bmax);o.vig=Math.max(o.vig,0.28);}
  map.setPaintProperty('sat','raster-saturation',Math.max(-1,Math.min(1,o.sat)));map.setPaintProperty('sat','raster-contrast',Math.max(-1,Math.min(1,o.con)));
  map.setPaintProperty('sat','raster-brightness-min',Math.max(0,o.bmin));map.setPaintProperty('sat','raster-brightness-max',Math.min(1,o.bmax));
  document.getElementById('vig').style.background=`radial-gradient(ellipse 70% 58% at 50% 46%,rgba(0,0,0,0) 45%,rgba(0,0,0,${Math.min(0.85,o.vig).toFixed(3)}) 100%)`;
  const g=document.getElementById('fx').getContext('2d');g.clearRect(0,0,W,H);if(o.snow<=0.01)return;
